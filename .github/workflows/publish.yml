name: Publish to PyPI

# Publishes via PyPI Trusted Publishing (OIDC). No API token is stored anywhere:
# GitHub mints a short-lived OIDC token for this specific workflow, and PyPI
# exchanges it for an equally short-lived upload token. A leaked repository
# secret can therefore no longer be used to push a release.
#
# Triggered by publishing a GitHub Release, not by pushing a tag, so that
# cutting a tag and shipping to PyPI stay separate, deliberate steps.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # setuptools-scm derives the version from the tag, so the full history
        # and the tags themselves have to be present -- a shallow clone would
        # produce a 0.0.1.dev... version.
        fetch-depth: 0

    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

    - name: Set up Python
      run: uv python install 3.13

    - name: Build
      run: uv build

    - name: Verify the built version matches the tag
      if: github.event_name == 'release'
      run: |
        tag="${GITHUB_REF_NAME#v}"
        built=$(ls dist/*.tar.gz | sed -E 's/.*-([0-9][^-]*)\.tar\.gz/\1/')
        echo "tag=$tag built=$built"
        if [ "$tag" != "$built" ]; then
          echo "::error::Release tag ($tag) does not match the built version ($built)."
          exit 1
        fi

    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: dist
        path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest

    # Gate the upload behind an environment so protection rules (required
    # reviewers, tag filters) can be attached to publishing itself.
    environment:
      name: pypi
      url: https://pypi.org/project/django-password-policies-iplweb/

    permissions:
      # Required for Trusted Publishing: lets the job request an OIDC token.
      id-token: write
      # Required to attach PEP 740 attestations to the uploaded files.
      attestations: write

    steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: dist
        path: dist/

    - name: Publish
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
