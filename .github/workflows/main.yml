name: CI

on:
  push:
    branches:
    - master
    - develop
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python-version }}, Django ${{ matrix.django-version }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
        django-version: ['4.2', '5.2', '6.0', '6.1']
        exclude:
          # Django 4.2 does not support Python 3.13.
          - python-version: '3.13'
            django-version: '4.2'
          # Django 6.x requires Python >= 3.12.
          - python-version: '3.10'
            django-version: '6.0'
          - python-version: '3.11'
            django-version: '6.0'
          - python-version: '3.10'
            django-version: '6.1'
          - python-version: '3.11'
            django-version: '6.1'

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5

    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        uv sync --all-extras --python ${{ matrix.python-version }}
        uv pip install "Django>=${{ matrix.django-version }},<${{ matrix.django-version }}.99"

    - name: Show resolved versions
      run: uv run --no-sync python -c "import sys, django; print(sys.version); print(django.get_version())"

    # --no-sync is required: a plain `uv run` re-syncs the environment from the
    # project metadata (django>=4.2) and would silently replace the Django
    # version pinned in the previous step with the newest release, making every
    # matrix cell test the same Django.
    - name: Run tests
      run: uv run --no-sync pytest --ds=password_policies.tests.test_settings password_policies/tests/ -s

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5

    - name: Set up Python
      run: uv python install 3.13

    - name: Install dependencies
      run: uv sync --all-extras

    # Both steps used to end in `|| true`. Combined with a ruff config that
    # aborted on an unknown rule selector, that made this job report success
    # without ever linting a line.
    - name: Lint with ruff
      run: uv run ruff check .

    - name: Check formatting with ruff
      run: uv run ruff format --check .
