name: CI

on:
  push:
    branches:
    - master
    - develop
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python-version }}, Django ${{ matrix.django-version }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
        django-version: ['4.2', '5.0', '5.1']
        exclude:
          - python-version: '3.13'
            django-version: '4.2'

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5

    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        uv sync --all-extras
        uv pip install "Django>=${{ matrix.django-version }},<${{ matrix.django-version }}.99"

    - name: Run tests
      run: uv run pytest --ds=password_policies.tests.test_settings password_policies/tests/ -s

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5

    - name: Set up Python
      run: uv python install 3.13

    - name: Install dependencies
      run: uv sync --all-extras

    - name: Lint with ruff
      run: uv run ruff check . || true

    - name: Check formatting with ruff
      run: uv run ruff format --check . || true
