[build-system]
requires = ["setuptools>=75.0", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "django-password-policies-iplweb"
dynamic = ["version"]
description = "A Django application to implement password policies."
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
authors = [
    {name = "Michal Pasternak", email = "michal.dtz@gmail.com"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
dependencies = [
    "django>=4.2",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-django",
    "pytest-cov",
    "freezegun",
    # Pinned to a minor series on purpose. `ruff format --check` gates CI, and
    # the formatter's output changes between minor releases -- an unpinned ruff
    # would fail the build on a day nobody touched the code.
    "ruff~=0.15.0",
]
docs = [
    "sphinx",
    "sphinx-rtd-theme",
]

[project.urls]
Funding = "https://buymeacoffee.com/mpasternak"
Homepage = "https://github.com/iplweb/django-password-policies-iplweb"

[tool.ruff]
target-version = "py310"
# South migrations are frozen historical artefacts from the Django 1.7 era.
# They are never imported or executed; rewriting them to please a linter would
# only risk changing what they record.
exclude = ["password_policies/south_migrations"]

[tool.ruff.lint]
select = ["E", "F", "W"]
# E501 (line length) and E225 (whitespace around operators) are left to
# `ruff format`. W503 used to be listed here as well, carried over from the
# flake8 config -- ruff has no such rule, and an unknown selector makes ruff
# abort before checking anything at all.
ignore = ["E501", "E225"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "password_policies.tests.test_settings"
testpaths = ["password_policies/tests"]
addopts = "-s"

[tool.coverage.run]
include = ["password_policies/*"]
omit = ["password_policies/tests/*"]

[tool.setuptools_scm]

[tool.setuptools.packages.find]
include = ["password_policies*"]

[tool.setuptools.package-data]
"password_policies" = [
    "locale/**/*",
    "tests/templates/**/*",
]
